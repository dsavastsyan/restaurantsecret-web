<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Страница не найдена — RestaurantSecret</title>
    <script>
      // SPA-fallback: сохраняем путь и возвращаемся на корень,
      // где React-роутер покажет компонент NotFound.
      var payLink = /^\/([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\/subscription\/?$/.exec(window.location.pathname)
      if (payLink) {
        try { sessionStorage.setItem('rsPayLinkToken', payLink[1]) } catch (e) {}
        window.location.replace('/subscription/checkout')
      } else {
        sessionStorage.setItem('redirectPath', window.location.pathname + window.location.search)
        window.location.replace('/')
      }
    </script>
  </head>
  <body></body>
</html>
