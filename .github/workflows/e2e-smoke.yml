name: e2e-smoke

on:
  pull_request: {}

jobs:
  backend-release-gate:
    name: backend-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for linked backend staging deployments
        env:
          BACKEND_RELEASE_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKEND_RELEASE_ENV: staging
        run: node scripts/verify-backend-release.mjs

  smoke:
    needs: backend-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_OTP: ${{ secrets.E2E_TEST_OTP }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
